[project]
name = "mailpulse"
version = "0.1.0"
description = "MailPulse — a modular FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pre-commit>=3.7",
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mailpulse"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mailpulse"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
